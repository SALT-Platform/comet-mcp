name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npx tsc --noEmit

  test:
    name: Vitest
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build HTTP bridge
        run: npm run build

      - name: Start HTTP bridge
        run: |
          npm run http > /tmp/comet-mcp-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3456/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/comet-mcp-http.log
          exit 1

      - name: Run vitest with coverage
        run: |
          npm run test:ci -- \
            --coverage \
            --coverage.provider=v8 \
            --coverage.reporter=text \
            --coverage.reporter=cobertura \
            --coverage.reportsDirectory=./coverage \
            --reporter=junit \
            --outputFile=test-results.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: coverage/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-test-results
          path: test-results.xml
